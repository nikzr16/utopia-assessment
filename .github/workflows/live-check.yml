# The robot visit (0010): after Vercel reports a successful production deploy,
# open the live app in a headless browser and check what a person would see.
# Vercel sends a repository_dispatch event (vercel.deployment.success) with the
# deployment's environment and url (decision 0019). GitHub runs this only from
# the default branch (main). Needs the repository variable LIVE_URL
# (Settings -> Secrets and variables -> Actions -> Variables).
name: live-check

on:
  repository_dispatch:
    types: [vercel.deployment.success]
  workflow_dispatch:

jobs:
  visit:
    name: robot visit
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.client_payload.environment == 'production'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Deployment
        run: echo "Checking ${{ vars.LIVE_URL }} after ${{ github.event.client_payload.url || 'a manual start' }}"
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 23
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run live-check
        env:
          LIVE_URL: ${{ vars.LIVE_URL }}
